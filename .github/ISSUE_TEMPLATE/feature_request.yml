name: 功能建议
description: 提议新的保守清理能力或体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题。扩大扫描或删除范围的建议必须说明误删风险和保守失败方式。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前体验为什么不足，不要包含个人文件或未脱敏路径。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与风险影响
      description: 说明候选项如何列出、风险如何标注、失败时如何保留数据以及如何撤销。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 此建议不会要求默认自动选择或自动删除文件。
          required: true
        - label: 我没有附带个人文件、凭据或未脱敏日志。
          required: true

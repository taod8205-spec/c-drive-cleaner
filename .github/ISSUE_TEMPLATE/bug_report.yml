name: Bug 报告
description: 报告可复现的错误、崩溃或不安全行为
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除用户名、完整个人路径、文件内容、令牌和其他敏感信息。
        安全漏洞不要在这里披露，请改用仓库的私密漏洞报告入口。
  - type: dropdown
    id: version
    attributes:
      label: 软件版本
      options:
        - v1.0.0
        - main 分支
        - 其他（请在补充信息中说明）
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 问题发生阶段
      options:
        - 启动或界面
        - 扫描
        - 人工审查
        - 移入隔离区
        - 恢复
        - 永久删除
        - 构建或测试
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏后的示例路径；不要上传个人文件或完整隔离清单。
      placeholder: |
        1. 启动……
        2. 选择……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供已脱敏的错误文本、截图或最小测试样例。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与安全确认
      options:
        - label: 我已移除个人路径、文件内容、凭据和其他敏感信息。
          required: true
        - label: 这不是需要私下披露的安全漏洞。
          required: true

name: Publish ShenQing v1.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'taod8205-spec/c-drive-cleaner'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.2
      - name: Build EXE and checksums
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "慎清-C盘清理审查器" --version-file "packaging/version_info.txt" "app.pyw"
          $exe = "dist/慎清-C盘清理审查器.exe"
          if ((Get-Item -LiteralPath $exe).VersionInfo.FileVersion -ne "1.1.0") { throw "Unexpected EXE version" }
          Copy-Item -LiteralPath $exe -Destination "dist/ShenQing-C-Drive-Cleaner-v1.1.0.exe"
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/ShenQing-C-Drive-Cleaner-v1.1.0.exe").Hash.ToLowerInvariant()
          "$sha  ShenQing-C-Drive-Cleaner-v1.1.0.exe" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii
          $notes = @'
          ## 更新
          - 主窗口按显示器工作区调整大小，清理操作按钮在任务栏上方可见。
          - 隔离区支持 Ctrl/Shift 多选、全选、批量恢复和批量永久删除。
          - 永久删除批次只要包含高风险项就整体阻止；逐项失败会继续处理并显示结果。
          - 合并了经过筛选的界面与扫描效率改进。

          默认仍为只读扫描、候选项不自动勾选，清理前需要手动审查。

          下载 EXE 后请用随附的 SHA256SUMS.txt 校验。EXE 未进行商业代码签名，Windows SmartScreen 可能显示未知发布者。
          '@
          $notes | Set-Content -LiteralPath "release-notes-v1.1.0.md" -Encoding utf8
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 "dist/ShenQing-C-Drive-Cleaner-v1.1.0.exe" "dist/SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "慎清 · C 盘清理审查器 v1.1.0" --notes-file "release-notes-v1.1.0.md" --latest
